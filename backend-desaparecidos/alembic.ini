[alembic]
script_location = alembic
prepend_sys_path = .

# synchronous version of the DB URL for alembic (sqlalchemy.url can be overridden in env.py)
sqlalchemy.url = postgresql://dev_user:dev_password_local@localhost:5432/desaparecidos_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
